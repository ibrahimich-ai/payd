<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Журнал аудита — Payd</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .audit-row { display: grid; grid-template-columns: 110px 36px 1fr 200px 130px 120px 80px; gap: 12px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--border); transition: background .12s; cursor: pointer; }
  .audit-row:hover { background: var(--surface-2); }
  .audit-row.sensitive { background: linear-gradient(90deg, var(--danger-soft) 0%, transparent 60%); border-left: 3px solid var(--danger); padding-left: 15px; }
  .audit-row .ico { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .audit-row.create .ico { background: var(--success-soft); color: var(--success); }
  .audit-row.update .ico { background: var(--primary-soft); color: var(--primary); }
  .audit-row.delete .ico { background: var(--danger-soft); color: var(--danger); }
  .audit-row.access .ico { background: var(--purple-soft); color: var(--purple); }
  .audit-row.payment .ico { background: var(--warning-soft); color: var(--warning); }

  .audit-row .desc { font-size: 13px; font-weight: 600; }
  .audit-row .desc b { color: var(--primary); }
  .audit-row .meta { font-size: 11px; color: var(--text-3); margin-top: 2px; font-family: 'Courier New', monospace; }

  .audit-row .time { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .audit-row .time-rel { font-size: 11px; color: var(--text-3); }

  .ip-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 4px; background: var(--surface-2); font-family: 'Courier New', monospace; font-size: 11px; }
  .ip-tag.local { color: var(--success); background: var(--success-soft); }
  .ip-tag.remote { color: var(--primary); background: var(--primary-soft); }

  .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .summary-card .l { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }
  .summary-card .v { font-size: 22px; font-weight: 800; margin-top: 4px; letter-spacing: -.02em; }
  .summary-card .s { font-size: 11px; color: var(--text-2); margin-top: 2px; }
</style>
</head>
<body>

<div id="app-root">

<div class="page-head">
  <div>
    <h1>Журнал аудита</h1>
    <div class="desc">Полный лог действий пользователей и системы · хранение 5 лет</div>
  </div>
  <div class="page-head-actions">
    <button class="btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Live режим
    </button>
    <button class="btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/></svg>
      Экспорт CSV
    </button>
    <button class="btn primary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>
      Отчёт для проверки ЦБ
    </button>
  </div>
</div>

<!-- SUMMARY -->
<div class="summary-grid">
  <div class="summary-card">
    <div class="l">Событий всего</div>
    <div class="v" data-live="kpi:audit:total">0</div>
    <div class="s">за весь период</div>
  </div>
  <div class="summary-card">
    <div class="l">Чувствительные</div>
    <div class="v">—</div>
    <div class="s">включается RLS-политиками</div>
  </div>
  <div class="summary-card">
    <div class="l">Активных пользователей</div>
    <div class="v">—</div>
    <div class="s">данные о сессиях</div>
  </div>
  <div class="summary-card">
    <div class="l">Подозрительных</div>
    <div class="v">0</div>
    <div class="s">правил безопасности нет</div>
  </div>
</div>

<!-- FILTERS -->
<div class="filter-bar">
  <div class="filter-search">
    <span class="si"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
    <input type="text" placeholder="Поиск по пользователю, объекту, IP, описанию..." />
  </div>
  <div class="filter-extras">
    <select><option>Все события</option><option>Создание</option><option>Изменение</option><option>Удаление</option><option>Доступ</option></select>
    <select><option>Все пользователи</option></select>
    <select><option>Сегодня</option><option>За неделю</option><option>За месяц</option></select>
    <select><option>Все объекты</option><option>Заявки</option><option>Клиенты</option><option>Платежи</option><option>Договоры</option><option>Настройки</option></select>
    <button class="btn sm" style="border-color: var(--danger); color: var(--danger);">Только чувствительные</button>
  </div>
</div>

<!-- AUDIT LOG -->
<div class="card">
  <div data-live="list:audit:events" style="min-height:200px;">
    <div style="padding:32px;text-align:center;color:var(--text-3);font-size:13px;">Загрузка журнала событий...</div>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
<script src="reports-data.js"></script>
<script>
  PaydApp.mountShell({
    active: 'audit',
    title: 'Журнал аудита',
    breadcrumbs: [{ label: 'Главная', href: 'dashboard.html' }, { label: 'Аудит' }]
  });
</script>
</body>
</html>
